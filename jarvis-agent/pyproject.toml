[build-system]
# Usamos setuptools para que el modo editable (`pip install -e`) cree bien el comando `jarvis`
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Jarvis-like CLI+Voice agent with tools (macOS) and GPT-5 Codex backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# -------------------------
# Dependencias principales
# -------------------------
dependencies = [
  # --- Config / settings ---
  "python-dotenv>=1.0.1",        # Cargar .env
  "pydantic>=2.7.0",             # Settings tipados
  "pydantic-settings>=2.3.0",    # Settings desde env
  "platformdirs>=4.2.0",         # Rutas estándar (logs/cache) si lo necesitas

  # --- CLI / logs ---
  "rich>=13.7.1",                # UI de terminal (paneles, colores, progreso)

  # --- OpenAI (GPT-5 Codex) ---
  "openai>=1.40.0",              # SDK oficial OpenAI

  # --- Voz: captura de audio ---
  "sounddevice>=0.4.7",          # Micrófono cross-platform (Mac va muy bien)
  "numpy>=1.26.4",               # Necesario para audio buffers y utilidades

  # --- Wake word ---
  # OpenWakeWord: open source, sin API key, modelos preentrenados (hey_jarvis, etc.)
  "openwakeword>=0.6.0",
  # Porcupine (opcional, solo si prefieres el motor de Picovoice)
  "pvporcupine>=3.0.4",
  "pvrecorder>=1.2.2",

  # --- Utilidades varias ---
  "requests>=2.32.3",            # HTTP básico (por si haces un buscador simple)

  # --- Web server ---
  "fastapi>=0.111.0",            # Servidor web async
  "uvicorn[standard]>=0.30.0",   # ASGI server
  "python-multipart>=0.0.9",     # Upload de archivos (FastAPI)

  # --- Groq API ---
  "groq>=0.9.0",                 # SDK Groq para LLM rápido

  # --- ElevenLabs TTS ---
  "elevenlabs>=1.0.0",           # SDK ElevenLabs para TTS de alta calidad

  # --- Google Gemini ---
  "google-genai>=1.0.0",         # SDK Gemini 2.0 Flash

  # --- Anthropic Claude (cerebro principal) ---
  "anthropic>=0.40.0",           # SDK Claude Sonnet 4.6

  # --- Voice: VAD (Silero) ---
  "torch>=2.0.0",                # PyTorch para Silero VAD (detección de voz)

  # --- Vision (macOS) ---
  "Pillow>=10.0.0",              # Procesamiento de imágenes (capturas de pantalla)
  "pyobjc-framework-Quartz>=10.0",  # Quartz para capturas de pantalla en macOS
  "pyobjc-framework-Cocoa>=10.0",   # AppKit para contexto de aplicaciones macOS
]

[project.optional-dependencies]
# Extras opcionales para herramientas futuras (no obligatorias ahora)
dev = [
  "pytest>=8.2.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.5",
  "mypy>=1.10.0",
  "black>=24.8.0",
  "pre-commit>=3.8.0",
  "types-requests>=2.32.0",
]

# Control por gestos (cámara)
gestures = [
  "mediapipe>=0.10.14",
  "opencv-python>=4.10.0.84",
]

# Si luego quieres automatizar navegador (para búsquedas y acciones en web)
browser = [
  "playwright>=1.46.0",
]

# Si luego haces embeddings/RAG local
rag = [
  "chromadb>=0.5.5",
]

# Generación de modelos 3D CAD con build123d
cad = [
  "build123d>=0.7.0",
]

[project.scripts]
# Esto crea el comando "jarvis" en tu entorno:
#   jarvis
# que ejecutará jarvis.main:main
jarvis = "jarvis.main:main"

[tool.setuptools]
# Estructura tipo src/ (tu paquete vive en src/jarvis)
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/jarvis"]
omit = [
  "*/tests/*",
  "src/jarvis/overlay/main_panel.py",   # UI PyObjC — no testeable sin display
  "src/jarvis/overlay/view.py",
  "src/jarvis/overlay/particles.py",
  "src/jarvis/overlay/window.py",
  "src/jarvis/overlay/hud.py",
  "src/jarvis/overlay/chat_panel.py",
  "src/jarvis/overlay/text_input.py",
  "src/jarvis/overlay/menubar.py",
  "src/jarvis/main.py",                 # entry point
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
