repos:
  # Ruff: linting rápido (reemplaza flake8 + isort + pyupgrade)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]

  # Black: formateo determinista
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3.11

  # Mypy: type checking en módulos críticos
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: >
          ^src/jarvis/(
            agent/circuit_breaker\.py|
            agent/prompt_guard\.py|
            agent/pev_models\.py|
            agent/pev_state\.py|
            overlay/swift_bridge\.py|
            tools/shell\.py|
            tools/filesystem\.py|
            tools/run_code\.py|
            logging_setup\.py
          )$
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies: [types-requests]

  # Hooks básicos: sin trailing whitespace, sin conflictos de merge, etc.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
        # Detectar claves privadas accidentalmente añadidas al repo
